<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ead8ae" />
  <meta name="description" content="نموذج رقمي لتسجيل اجتماعات الفرقة الكشفية" />
  <title>سجل اجتماعات مجموعه الصخره</title>
  <style>
    :root {
      --ink: #4d3522;
      --ink-soft: #765b3d;
      --paper: #e9d5a8;
      --paper-light: #f3e5c4;
      --red: #9a2d24;
      --green: #244d3b;
      --green-light: #35694f;
      --gold: #b38a3e;
      --line: rgba(77, 53, 34, 0.72);
      font-family: Tahoma, "Noto Naskh Arabic", "Traditional Arabic", Arial,
        sans-serif;
      color: var(--ink);
      background: #c3a779;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 18%, rgba(80, 48, 22, 0.15) 0 1px, transparent 2px),
        radial-gradient(circle at 82% 72%, rgba(91, 54, 21, 0.12) 0 2px, transparent 4px),
        linear-gradient(135deg, #b99867, #d2bc8b 48%, #af8d5c);
      background-size: 37px 37px, 83px 83px, auto;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .page {
      position: relative;
      width: min(1180px, calc(100% - 20px));
      min-height: calc(100vh - 20px);
      margin: 10px auto;
      padding: 58px 34px 46px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 8% 12%, rgba(117, 75, 29, 0.12), transparent 20%),
        radial-gradient(ellipse at 92% 86%, rgba(128, 78, 29, 0.11), transparent 24%),
        radial-gradient(circle at 25% 67%, rgba(101, 63, 28, 0.05) 0 1px, transparent 2px),
        linear-gradient(95deg, rgba(255, 255, 255, 0.12), transparent 42%),
        var(--paper);
      background-size: auto, auto, 21px 21px, auto, auto;
      box-shadow: 0 18px 54px rgba(54, 32, 13, 0.28);
    }

    .rope {
      position: absolute;
      z-index: 5;
      pointer-events: none;
      background-color: #76502e;
      box-shadow:
        0 0 0 1px #4f321c,
        inset 0 0 4px rgba(255, 230, 166, 0.45),
        0 2px 4px rgba(61, 37, 18, 0.45);
    }

    .rope.horizontal {
      right: 25px;
      left: 25px;
      height: 17px;
      background-image: repeating-linear-gradient(52deg,
          #4e301b 0 5px,
          #ba8b50 6px 12px,
          #62401f 13px 18px,
          #d2a866 19px 23px,
          #54341d 24px 29px);
    }

    .rope.vertical {
      top: 25px;
      bottom: 25px;
      width: 17px;
      background-image: repeating-linear-gradient(-38deg,
          #4e301b 0 5px,
          #ba8b50 6px 12px,
          #62401f 13px 18px,
          #d2a866 19px 23px,
          #54341d 24px 29px);
    }

    .rope.top {
      top: 16px;
    }

    .rope.bottom {
      bottom: 16px;
    }

    .rope.right {
      right: 16px;
    }

    .rope.left {
      left: 16px;
    }

    .rope-knot {
      position: absolute;
      z-index: 6;
      width: 30px;
      height: 30px;
      border: 2px solid #4c2d18;
      border-radius: 50%;
      pointer-events: none;
      background:
        repeating-linear-gradient(45deg, #5c391e 0 5px, #c39354 6px 11px, #664121 12px 17px);
      box-shadow: inset 0 0 5px #e1bb75, 0 2px 5px rgba(55, 31, 13, 0.45);
    }

    .knot-tr {
      top: 9px;
      right: 9px;
    }

    .knot-tl {
      top: 9px;
      left: 9px;
    }

    .knot-br {
      right: 9px;
      bottom: 9px;
    }

    .knot-bl {
      bottom: 9px;
      left: 9px;
    }

    .paper-content {
      position: relative;
      z-index: 2;
    }

    .masthead {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 18px;
      margin-bottom: 14px;
    }

    .top-note {
      min-width: 0;
      font-family: "Traditional Arabic", Tahoma, serif;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.7;
    }

    .signature-top {
      justify-self: start;
      width: min(100%, 230px);
      text-align: right;
    }

    .badge {
      width: 82px;
      height: 82px;
      color: var(--green);
      filter: drop-shadow(0 2px 1px rgba(66, 40, 17, 0.2));
    }

    .title {
      margin: 4px 0 30px;
      color: var(--red);
      font-family: "Traditional Arabic", "Noto Naskh Arabic", Georgia, serif;
      font-size: clamp(1.8rem, 4.5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.35;
      text-align: center;
      text-shadow: 0 1px rgba(255, 244, 216, 0.8);
    }

    .title::after {
      display: block;
      width: 118px;
      height: 5px;
      margin: 12px auto 0;
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
      content: "";
    }

    .meeting-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 40px;
      margin-bottom: 34px;
    }

    .field {
      display: flex;
      align-items: end;
      min-width: 0;
      gap: 10px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field-label {
      flex: 0 0 auto;
      padding-bottom: 8px;
      font-family: "Traditional Arabic", Tahoma, serif;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .line-input,
    .line-textarea {
      width: 100%;
      min-width: 0;
      min-height: 46px;
      border: 0;
      border-bottom: 2px dotted var(--line);
      border-radius: 0;
      outline: 0;
      color: #3f2a1c;
      background: transparent;
      padding: 8px 4px 7px;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .line-input:focus,
    .line-textarea:focus {
      border-bottom-color: var(--green);
      background: rgba(255, 246, 222, 0.3);
      box-shadow: 0 2px 0 rgba(179, 138, 62, 0.28);
    }

    .line-input::placeholder,
    .line-textarea::placeholder {
      color: rgba(77, 53, 34, 0.5);
    }

    .time-fields {
      display: grid;
      grid-template-columns: auto minmax(110px, 1fr) auto minmax(110px, 1fr);
      align-items: end;
      gap: 8px;
      width: 100%;
    }

    .time-word {
      padding-bottom: 9px;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 13px;
      color: var(--green);
      font-family: "Traditional Arabic", Tahoma, serif;
      font-size: 1.35rem;
    }

    .section-heading::after {
      height: 1px;
      flex: 1;
      background: linear-gradient(to left, var(--gold), transparent);
      content: "";
    }

    .activities-wrap {
      overflow: visible;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: rgba(255, 247, 226, 0.18);
    }

    th,
    td {
      border: 1px solid var(--line);
      text-align: right;
      vertical-align: top;
    }

    th {
      padding: 13px 9px;
      color: #36251a;
      background: rgba(139, 102, 52, 0.1);
      font-family: "Traditional Arabic", Tahoma, serif;
      font-size: 0.94rem;
    }

    td {
      padding: 8px;
    }

    td .line-input,
    td .line-textarea {
      min-height: 42px;
      border-bottom-width: 1px;
      font-size: 0.94rem;
    }

    td .line-textarea {
      display: block;
      height: 62px;
      resize: vertical;
    }

    .delete-cell {
      width: 52px;
      text-align: center;
      vertical-align: middle;
    }

    .delete-button {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(154, 45, 36, 0.35);
      border-radius: 50%;
      color: var(--red);
      background: rgba(255, 244, 218, 0.45);
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    .delete-button:hover {
      background: rgba(154, 45, 36, 0.1);
    }

    .delete-button:active {
      transform: scale(0.94);
    }

    .table-actions {
      display: flex;
      justify-content: flex-start;
      margin-top: 14px;
    }

    .secondary-button,
    .primary-button {
      min-height: 50px;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .secondary-button {
      border: 1px solid var(--green);
      padding: 10px 22px;
      color: var(--green);
      background: rgba(241, 226, 190, 0.68);
    }

    .secondary-button:hover {
      color: #fff8e6;
      background: var(--green);
    }

    .submit-area {
      display: grid;
      justify-items: center;
      margin-top: 38px;
    }

    .primary-button {
      width: min(100%, 420px);
      min-height: 58px;
      border: 1px solid #173829;
      padding: 13px 30px;
      color: #fff9e9;
      background: var(--green);
      box-shadow:
        0 4px 0 #17392b,
        0 8px 18px rgba(40, 64, 47, 0.22);
      font-size: 1.1rem;
    }

    .primary-button:hover {
      background: var(--green-light);
      transform: translateY(-1px);
    }

    .primary-button:disabled {
      cursor: wait;
      opacity: 0.7;
      transform: none;
    }

    .form-message {
      width: min(100%, 650px);
      min-height: 24px;
      margin: 20px auto 0;
      color: var(--red);
      font-weight: 700;
      text-align: center;
    }

    .success {
      display: none;
      min-height: 58vh;
      place-content: center;
      justify-items: center;
      padding: 35px 10px;
      text-align: center;
    }

    .success.visible {
      display: grid;
    }

    .success-mark {
      display: grid;
      width: 76px;
      height: 76px;
      margin-bottom: 20px;
      place-items: center;
      border: 2px solid var(--gold);
      border-radius: 50%;
      color: #fff9e9;
      background: var(--green);
      font-size: 2rem;
    }

    .success h2 {
      margin: 0 0 10px;
      color: var(--green);
      font-family: "Traditional Arabic", Tahoma, serif;
      font-size: clamp(1.55rem, 5vw, 2.35rem);
    }

    .success p {
      margin: 0 0 28px;
      color: var(--ink-soft);
      font-size: 1.05rem;
    }

    .required-mark {
      color: var(--red);
    }

    input[type="date"],
    input[type="time"],
    input[type="number"] {
      direction: rtl;
    }

    @media (max-width: 760px) {
      .page {
        width: calc(100% - 10px);
        min-height: calc(100vh - 10px);
        margin: 5px;
        padding: 50px 26px 40px;
      }

      .rope.horizontal {
        right: 20px;
        left: 20px;
        height: 13px;
      }

      .rope.vertical {
        top: 20px;
        bottom: 20px;
        width: 13px;
      }

      .rope.top {
        top: 12px;
      }

      .rope.bottom {
        bottom: 12px;
      }

      .rope.right {
        right: 12px;
      }

      .rope.left {
        left: 12px;
      }

      .rope-knot {
        width: 25px;
        height: 25px;
      }

      .knot-tr {
        top: 6px;
        right: 6px;
      }

      .knot-tl {
        top: 6px;
        left: 6px;
      }

      .knot-br {
        right: 6px;
        bottom: 6px;
      }

      .knot-bl {
        bottom: 6px;
        left: 6px;
      }

      .masthead {
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      .masthead .top-note:first-child {
        grid-column: 1;
        grid-row: 1;
      }

      .badge {
        grid-column: 2;
        grid-row: 1;
        width: 64px;
        height: 64px;
      }

      .signature-top {
        grid-column: 1 / -1;
        grid-row: 2;
        width: 100%;
        justify-self: stretch;
      }

      .title {
        margin-top: 14px;
      }

      .meeting-fields {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .field.full {
        grid-column: auto;
      }

      .time-field {
        display: block;
      }

      .time-field>.field-label {
        display: block;
      }

      .time-fields {
        margin-top: 4px;
      }

      table,
      tbody,
      tr,
      td {
        display: block;
        width: 100%;
      }

      thead {
        display: none;
      }

      table {
        border: 0;
        background: transparent;
      }

      tbody {
        display: grid;
        gap: 18px;
      }

      tr {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-top: 5px solid var(--green);
        background: rgba(255, 247, 226, 0.25);
        box-shadow: 0 5px 14px rgba(74, 49, 25, 0.08);
      }

      td {
        display: grid;
        grid-template-columns: minmax(105px, 0.55fr) 1fr;
        align-items: center;
        border: 0;
        border-bottom: 1px solid rgba(77, 53, 34, 0.25);
        padding: 8px 10px;
      }

      td::before {
        padding-left: 10px;
        color: var(--ink-soft);
        font-weight: 700;
        content: attr(data-label);
      }

      td .line-textarea {
        height: 72px;
      }

      .delete-cell {
        display: flex;
        width: 100%;
        justify-content: flex-end;
        border-bottom: 0;
        padding: 10px;
      }

      .delete-cell::before {
        display: none;
      }

      .delete-button {
        width: auto;
        min-width: 96px;
        height: 42px;
        border-radius: 4px;
      }
    }

    @media (max-width: 420px) {
      .page {
        padding-right: 24px;
        padding-left: 24px;
      }

      .top-note {
        font-size: 0.9rem;
      }

      .badge {
        width: 56px;
        height: 56px;
      }

      .time-fields {
        grid-template-columns: auto 1fr;
      }

      td {
        grid-template-columns: 1fr;
        gap: 3px;
      }
    }

    /* Modern digital treatment */
    :root {
      --ink: #18302b;
      --ink-soft: #667b75;
      --paper: #ffffff;
      --paper-light: #f7faf8;
      --red: #b44343;
      --green: #176b58;
      --green-light: #21806b;
      --gold: #d6a84b;
      --line: #d7e2de;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 92% 3%, rgba(214, 168, 75, 0.14), transparent 26rem),
        radial-gradient(circle at 3% 90%, rgba(23, 107, 88, 0.1), transparent 30rem),
        #f1f6f4;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      min-height: auto;
      margin: 32px auto;
      padding: 48px;
      overflow: visible;
      border: 1px solid rgba(23, 107, 88, 0.1);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 24px 70px rgba(23, 57, 49, 0.1);
    }

    .paper-content {
      z-index: auto;
    }

    .hero {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 34px;
      padding-bottom: 30px;
      border-bottom: 1px solid #e3ebe8;
    }

    .badge-wrap {
      display: grid;
      width: 88px;
      height: 88px;
      flex: 0 0 88px;
      place-items: center;
      border-radius: 24px;
      background: linear-gradient(145deg, #edf7f3, #dceee7);
      box-shadow: inset 0 0 0 1px rgba(23, 107, 88, 0.08);
      overflow: hidden;
    }

    .badge {
      width: 76px;
      height: 76px;
      object-fit: contain;
      border-radius: 16px;
      filter: none;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--green);
      font-size: 0.86rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .title {
      margin: 0;
      color: #173b33;
      font-family: Tahoma, Arial, sans-serif;
      font-size: clamp(1.65rem, 4vw, 2.55rem);
      font-weight: 800;
      line-height: 1.45;
      text-align: right;
      text-shadow: none;
    }

    .title::after {
      display: none;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--ink-soft);
      font-size: 0.98rem;
      line-height: 1.8;
    }

    .meeting-fields,
    .activities-section {
      border: 1px solid #e1eae6;
      border-radius: 20px;
      background: #fbfdfc;
    }

    .meeting-fields {
      gap: 22px 28px;
      margin-bottom: 24px;
      padding: 26px;
    }

    .field {
      display: block;
    }

    .field-label {
      display: block;
      padding: 0 2px 8px;
      color: #28463f;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 0.93rem;
      font-weight: 700;
    }

    .line-input,
    .line-textarea {
      min-height: 50px;
      border: 1px solid #cedbd6;
      border-radius: 11px;
      padding: 10px 13px;
      background: #fff;
      color: #17352e;
    }

    .line-input:focus,
    .line-textarea:focus {
      border-color: var(--green);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(23, 107, 88, 0.1);
    }

    .time-field>.field-label {
      margin-bottom: 2px;
    }

    .time-fields {
      grid-template-columns: auto minmax(120px, 1fr) auto minmax(120px, 1fr);
      align-items: center;
      gap: 10px;
    }

    .time-word {
      padding: 0;
      font-size: 0.9rem;
    }

    .activities-section {
      padding: 26px;
    }

    .section-heading {
      margin-bottom: 20px;
      color: #173b33;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .section-heading::after {
      background: linear-gradient(to left, #d9e5e1, transparent);
    }

    table {
      overflow: hidden;
      border: 1px solid #dbe6e2;
      border-radius: 14px;
      background: #fff;
    }

    th,
    td {
      border-color: #dfe8e5;
    }

    th {
      padding: 14px 10px;
      color: #31524a;
      background: #eef6f3;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 0.84rem;
      line-height: 1.6;
    }

    td {
      padding: 7px;
    }

    td .line-input,
    td .line-textarea {
      border-color: transparent;
      border-radius: 8px;
      background: transparent;
    }

    td .line-input:focus,
    td .line-textarea:focus {
      border-color: var(--green);
      background: #fff;
    }

    .delete-button {
      border-color: rgba(180, 67, 67, 0.16);
      color: #a33c3c;
      background: #fff4f4;
    }

    .secondary-button {
      border: 0;
      border-radius: 10px;
      color: var(--green);
      background: #e8f3ef;
    }

    .secondary-button:hover {
      color: #fff;
      background: var(--green);
    }

    .submit-area {
      margin-top: 28px;
    }

    .primary-button {
      min-height: 56px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #176b58, #0e5646);
      box-shadow: 0 10px 24px rgba(23, 107, 88, 0.23);
    }

    .primary-button:hover {
      background: linear-gradient(135deg, #21806b, #176b58);
    }

    .form-message {
      font-size: 0.93rem;
      line-height: 1.7;
    }

    .success-mark {
      border: 0;
      background: var(--green);
      box-shadow: 0 10px 25px rgba(23, 107, 88, 0.2);
    }

    @media (max-width: 760px) {
      .page {
        width: calc(100% - 20px);
        min-height: calc(100vh - 20px);
        margin: 10px;
        padding: 24px 16px;
        border-radius: 20px;
      }

      .hero {
        align-items: flex-start;
        gap: 14px;
        margin-bottom: 24px;
        padding: 4px 2px 22px;
      }

      .badge-wrap {
        width: 62px;
        height: 62px;
        flex-basis: 62px;
        border-radius: 18px;
      }

      .badge {
        width: 48px;
        height: 48px;
      }

      .title {
        font-size: clamp(1.35rem, 6.3vw, 1.8rem);
        line-height: 1.5;
      }

      .subtitle {
        display: none;
      }

      .meeting-fields,
      .activities-section {
        border-radius: 16px;
        padding: 18px 14px;
      }

      .meeting-fields {
        gap: 17px;
      }

      .time-field {
        display: block;
      }

      .time-fields {
        grid-template-columns: auto 1fr;
      }

      tr {
        border: 1px solid #d9e5e1;
        border-top: 4px solid var(--green);
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 7px 20px rgba(24, 67, 57, 0.07);
      }

      td {
        border-bottom-color: #e5ecea;
      }
    }

    @media (max-width: 420px) {
      .page {
        padding-right: 14px;
        padding-left: 14px;
      }

      .eyebrow {
        font-size: 0.75rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
  <meta name="description"
    content="Enables Scout leaders to digitally record meeting details and activities in Arabic with a paper-style form, ensuring easy submission and accurate record-keeping.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Figma Make App">
  <meta property="og:description"
    content="Enables Scout leaders to digitally record meeting details and activities in Arabic with a paper-style form, ensuring easy submission and accurate record-keeping.">
</head>

<body>
  <main class="page">
    <div class="paper-content">
      <form id="report-form" novalidate>
        <header class="hero">
          <div class="badge-wrap">
            <img class="badge" src="/كشافه.jpg" alt="شعار الكشافة" />
          </div>
          <div>
            <p class="eyebrow">نموذج توثيق الاجتماع</p>
            <h1 class="title">سجل اجتماعات مجموعه الصخره </h1>
            <p class="subtitle">سجّل بيانات الاجتماع والأنشطة المنفّذة </p>
          </div>
        </header>

        <section class="meeting-fields" aria-label="بيانات الاجتماع">
          <label class="field">
            <span class="field-label">التاريخ <span class="required-mark">*</span></span>
            <input class="line-input" id="meeting-date" name="meetingDate" type="date" required />
          </label>

          <label class="field">
            <span class="field-label">المكان <span class="required-mark">*</span></span>
            <input class="line-input" id="location" name="location" type="text" placeholder="مكان الاجتماع"
              autocomplete="off" required />
          </label>

          <label class="field">
            <span class="field-label">القطاع <span class="required-mark">*</span></span>
            <select class="line-input" id="sector" name="sector" required>
              <option value="" selected disabled>اختر القطاع</option>
              <option value="براعم ويرقات">براعم ويرقات</option>
              <option value="أشبال وزهرات">أشبال وزهرات</option>
              <option value="كشافة ومرشدات">كشافة ومرشدات</option>
              <option value="متقدم ومتقدمات">متقدم ومتقدمات</option>
              <option value="جوالة ودليلات">جوالة ودليلات</option>
            </select>
          </label>

          <div class="field full time-field">
            <span class="field-label">المدة <span class="required-mark">*</span></span>
            <div class="time-fields">
              <label class="time-word" for="start-time">من الساعة</label>
              <input class="line-input" id="start-time" name="startTime" type="time" required />
              <label class="time-word" for="end-time">إلى الساعة</label>
              <input class="line-input" id="end-time" name="endTime" type="time" required />
            </div>
          </div>

          <label class="field">
            <span class="field-label">الحاضرون <span class="required-mark">*</span></span>
            <input class="line-input" id="attendees" name="attendees" type="number" inputmode="numeric" min="0"
              placeholder="0" required />
          </label>

          <label class="field">
            <span class="field-label">الغائبون <span class="required-mark">*</span></span>
            <input class="line-input" id="absentees" name="absentees" type="number" inputmode="numeric" min="0"
              placeholder="0" required />
          </label>
        </section>

        <section class="activities-section" aria-labelledby="activities-title">
          <h2 class="section-heading" id="activities-title">أنشطة الاجتماع</h2>
          <div class="activities-wrap">
            <table>
              <colgroup>
                <col style="width: 24%" />
                <col style="width: 13%" />
                <col style="width: 12%" />
                <col style="width: 16%" />
                <col style="width: 16%" />
                <col style="width: 14%" />
                <col style="width: 5%" />
              </colgroup>
              <thead>
                <tr>
                  <th scope="col">محتوى الاجتماع</th>
                  <th scope="col">المجال</th>
                  <th scope="col">التوقيت</th>
                  <th scope="col">الأدوات المستخدمة</th>
                  <th scope="col">مسؤول التنفيذ</th>
                  <th scope="col">ملاحظات</th>
                  <th scope="col" aria-label="حذف النشاط"></th>
                </tr>
              </thead>
              <tbody id="activities-body"></tbody>
            </table>
          </div>
          <div class="table-actions">
            <button class="secondary-button" id="add-activity" type="button">+ إضافة نشاط</button>
          </div>
        </section>

        <div class="submit-area">
          <button class="primary-button" id="submit-button" type="submit">
            إرسال سجل الاجتماع
          </button>
        </div>
        <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>
      </form>

      <section class="success" id="success-screen" aria-live="polite">
        <div class="success-mark" aria-hidden="true">✓</div>
        <h2>تم تسجيل الاجتماع بنجاح ✓</h2>
        <p>تم إرسال بيانات الاجتماع وحفظها في السجل.</p>
        <button class="primary-button" id="new-report" type="button">تسجيل اجتماع جديد</button>
      </section>
    </div>
  </main>

  <template id="activity-template">
    <tr>
      <td data-label="محتوى الاجتماع">
        <textarea class="line-textarea activity-content" aria-label="محتوى الاجتماع" placeholder="اكتب محتوى النشاط"
          required></textarea>
      </td>
      <td data-label="المجال">
        <textarea class="line-textarea activity-field" aria-label="المجال"></textarea>
      </td>
      <td data-label="التوقيت">
        <textarea class="line-textarea activity-duration" aria-label="التوقيت" placeholder="مثال: 20 دقيقة"></textarea>
      </td>
      <td data-label="الأدوات المستخدمة">
        <textarea class="line-textarea activity-tools" aria-label="الأدوات المستخدمة"></textarea>
      </td>
      <td data-label="مسؤول التنفيذ">
        <textarea class="line-textarea activity-person" aria-label="مسؤول التنفيذ"></textarea>
      </td>
      <td data-label="ملاحظات">
        <textarea class="line-textarea activity-notes" aria-label="ملاحظات"></textarea>
      </td>
      <td class="delete-cell" data-label="">
        <button class="delete-button" type="button" aria-label="حذف النشاط">حذف</button>
      </td>
    </tr>
  </template>

  <script>
    // رابط تطبيق Google Apps Script (سيتم تعبئته تلقائياً بواسطة Vite من ملف .env)
    const FORM_ENDPOINT = "https://script.google.com/macros/s/AKfycbwr5AJ8h10trAuqCIkj0g-a3IaU79s-7GpCuu3ExdCFIYnW2Es2mHA-89fw50f7B37Dtw/exec";

    const form = document.getElementById("report-form");
    const activitiesBody = document.getElementById("activities-body");
    const activityTemplate = document.getElementById("activity-template");
    const submitButton = document.getElementById("submit-button");
    const formMessage = document.getElementById("form-message");
    const successScreen = document.getElementById("success-screen");

    function addActivity() {
      const fragment = activityTemplate.content.cloneNode(true);
      const row = fragment.querySelector("tr");
      row.querySelector(".delete-button").addEventListener("click", () => {
        if (activitiesBody.children.length === 1) {
          row.querySelectorAll("input, textarea").forEach((field) => {
            field.value = "";
          });
          row.querySelector(".activity-content").focus();
          return;
        }
        row.remove();
      });
      activitiesBody.appendChild(fragment);
    }

    function getActivities() {
      return [...activitiesBody.querySelectorAll("tr")].map((row) => ({
        meetingContent: row.querySelector(".activity-content").value.trim(),
        field: row.querySelector(".activity-field").value.trim(),
        duration: row.querySelector(".activity-duration").value.trim(),
        toolsUsed: row.querySelector(".activity-tools").value.trim(),
        personResponsible: row.querySelector(".activity-person").value.trim(),
        notes: row.querySelector(".activity-notes").value.trim(),
      }));
    }

    function getPayload() {
      return {
        meetingDate: document.getElementById("meeting-date").value,
        location: document.getElementById("location").value.trim(),
        sector: document.getElementById("sector").value,
        startTime: document.getElementById("start-time").value,
        endTime: document.getElementById("end-time").value,
        attendees: Number(document.getElementById("attendees").value),
        absentees: Number(document.getElementById("absentees").value),
        signature: "",
        activities: getActivities(),
      };
    }

    function showError(message) {
      formMessage.textContent = message;
      formMessage.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    document.getElementById("add-activity").addEventListener("click", () => {
      addActivity();
      activitiesBody.lastElementChild.querySelector(".activity-content").focus();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      formMessage.textContent = "";

      if (!form.checkValidity()) {
        form.reportValidity();
        showError("يرجى استكمال جميع الحقول المطلوبة قبل الإرسال.");
        return;
      }

      const payload = getPayload();
      if (payload.endTime <= payload.startTime) {
        showError("يجب أن يكون وقت نهاية الاجتماع بعد وقت البداية.");
        document.getElementById("end-time").focus();
        return;
      }

      if (FORM_ENDPOINT === "%VITE" + "_GOOGLE_SCRIPT_URL%" || FORM_ENDPOINT.includes("REPLACE_WITH") || !FORM_ENDPOINT.startsWith("http")) {
        showError("لم يتم إعداد رابط الإرسال بعد. يرجى إنشاء ملف .env وإضافة رابط Google Apps Script في متغير VITE_GOOGLE_SCRIPT_URL ثم إعادة تشغيل الخادم.");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "جارٍ إرسال السجل...";

      try {
        console.log("Submitting to:", FORM_ENDPOINT);
        console.log("Payload:", payload);

        const response = await fetch(FORM_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
        });

        const rawText = await response.text();
        console.log("Raw response:", response.status, rawText);

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}: ${rawText.substring(0, 50)}`);
        }

        let result;
        try {
          result = JSON.parse(rawText);
        } catch (e) {
          throw new Error("استجابة غير صالحة من الخادم (ليست JSON). يرجى التأكد من نشر السكربت كـ Web App بصلاحية Anyone.");
        }

        if (!result.success) {
          throw new Error(result.error || `الخادم رفض الطلب: ${rawText.substring(0, 50)}`);
        }

        form.hidden = true;
        successScreen.classList.add("visible");
        successScreen.querySelector("h2").focus?.();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (error) {
        console.error("Submission error:", error);
        showError(`تعذر إرسال السجل: ${error.message || 'مشكلة في الاتصال'}. يرجى المحاولة مرة أخرى.`);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "إرسال سجل الاجتماع";
      }
    });

    document.getElementById("new-report").addEventListener("click", () => {
      form.reset();
      activitiesBody.replaceChildren();
      addActivity();
      formMessage.textContent = "";
      successScreen.classList.remove("visible");
      form.hidden = false;
      document.getElementById("meeting-date").focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    addActivity();
  </script>
</body>

</html>
